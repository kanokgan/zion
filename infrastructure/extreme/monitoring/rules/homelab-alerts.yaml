# infrastructure/extreme/monitoring/rules/homelab-alerts.yaml
# Alerts for the problems this homelab has actually had (ADR 0010), on top of the chart's default rules
# (pod crash loops, node not ready, Watchdog, target down, ...). Lenovo-specific: the GPU rules do not belong on the mini.
# Every expression was checked against metric names that exist in this stack; a rule on a metric that never appears
# would stay silent, so add new ones only after finding the metric in Prometheus.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab
  namespace: monitoring
  labels:
    app.kubernetes.io/name: homelab-alerts
    app.kubernetes.io/instance: homelab
    app.kubernetes.io/part-of: zion-lab
spec:
  groups:
    - name: homelab.host
      rules:
        # One big filesystem holds the OS, k3s, Postgres and the 1.3 TB library (docs/services/immich.md): watch it.
        - alert: HostDiskUsageHigh
          expr: |
            (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}
                 / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) > 0.80
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Disk / on {{ $labels.instance }} is {{ $value | humanizePercentage }} full"
            description: "The root filesystem holds everything on this host. Free space or grow it before it reaches 100%."
        - alert: HostDiskUsageCritical
          expr: |
            (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}
                 / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) > 0.90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Disk / on {{ $labels.instance }} is {{ $value | humanizePercentage }} full"
            description: "k3s, Postgres and Immich start failing when this fills up."

        # The Lenovo's wired link negotiated 100 Mb/s on 2026-10-17 (hosts/ubuntu-extreme/README.md). 1 Gb/s is 125000000 bytes/s.
        # This fires today and keeps firing until the cable or router port is fixed.
        - alert: HostNetworkLinkSlow
          expr: |
            node_network_speed_bytes{device=~"en.*|eth.*"} > 0
              and node_network_speed_bytes{device=~"en.*|eth.*"} < 125000000
              and on(instance, device) node_network_up{device=~"en.*|eth.*"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Network link {{ $labels.device }} on {{ $labels.instance }} runs below 1 Gb/s ({{ $value | humanize }}B/s)"
            description: "A wired port that negotiates 100 Mb/s usually means a bad cable or port."

    - name: homelab.gpu
      rules:
        # The GPU silently stopped working after a driver upgrade and nothing noticed for weeks (incident 2026-10-17).
        - alert: GpuNotAdvertised
          expr: (sum(kube_node_status_allocatable{resource="nvidia_com_gpu"}) or vector(0)) < 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "No node advertises nvidia.com/gpu"
            description: "Pods that ask for a GPU cannot start. Check the driver (a reboot is needed after a driver upgrade) and the device plugin."
        - alert: NvidiaDevicePluginNotReady
          expr: kube_daemonset_status_number_unavailable{namespace="kube-system",daemonset="nvidia-device-plugin"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "The NVIDIA device plugin is not running on {{ $value }} node(s)"
            description: "It is configured to crash when the driver is broken (FAIL_ON_INIT_ERROR), which is the signal to look at the driver."

    - name: homelab.flux
      rules:
        # controller_runtime_reconcile_errors_total comes from the Flux controllers (PodMonitor in flux-podmonitor.yaml).
        # It says which controller fails, not which object; object-level readiness needs kube-state-metrics custom resource state.
        - alert: FluxReconcileErrors
          expr: sum by (controller) (increase(controller_runtime_reconcile_errors_total{namespace="flux-system"}[15m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Flux controller {{ $labels.controller }} keeps failing to reconcile"
            description: "Find the failing object with: kubectl get kustomizations,helmreleases -A"
