# infrastructure/extreme/monitoring/helmrelease.yaml
# kube-prometheus-stack on the Lenovo (ADR 0010), stage 1: Prometheus, Grafana, Alertmanager and the exporters,
# with nothing sensitive and no access from outside the cluster. Open Grafana with a port-forward (docs/services/monitoring.md).
# Later stages add: SOPS secrets (Grafana admin, Telegram), tailnet access, Immich, GPU and backup-job rules.
#
# Chart version pinned exactly; upgrade by editing `version` in a commit. Helm silently ignores unknown values keys,
# so every key below was checked against this chart version's values.yaml (the Grafana, node-exporter and
# kube-state-metrics blocks pass through to their subcharts).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/part-of: zion-lab
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.10.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # k3s runs the control plane in one process, so these separate scrape targets and rules do not exist.
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false

    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

    prometheus:
      prometheusSpec:
        # 15 days; disposable data, not backed up (ADR 0010).
        retention: 15d
        retentionSize: 20GB
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 3Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 25Gi
        # Pick up every ServiceMonitor, PodMonitor, rule and probe in the cluster, not only the chart's own.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false

    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

    grafana:
      defaultDashboardsTimezone: Asia/Bangkok
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      # Stateless: dashboards and data sources come from Git. The admin password is generated into a Secret
      # for now and becomes a SOPS secret in stage 2.

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
