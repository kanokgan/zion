# infrastructure/extreme/monitoring/helmrelease.yaml
# kube-prometheus-stack on the Lenovo (ADR 0010), stage 1: Prometheus, Grafana, Alertmanager and the exporters,
# with nothing sensitive and no access from outside the cluster. Open Grafana with a port-forward (docs/services/monitoring.md).
# Later stages add: SOPS secrets (Grafana admin, Telegram), tailnet access, Immich, GPU and backup-job rules.
#
# Chart version pinned exactly; upgrade by editing `version` in a commit. Helm silently ignores unknown values keys,
# so every key below was checked against this chart version's values.yaml (the Grafana, node-exporter and
# kube-state-metrics blocks pass through to their subcharts).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/part-of: zion-lab
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.10.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # k3s runs the control plane in one process, so these separate scrape targets and rules do not exist.
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false

    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

    prometheus:
      prometheusSpec:
        # 15 days; disposable data, not backed up (ADR 0010).
        retention: 15d
        retentionSize: 20GB
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 3Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 25Gi
        # Pick up every ServiceMonitor, PodMonitor, rule and probe in the cluster, not only the chart's own.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false

    alertmanager:
      alertmanagerSpec:
        # The whole configuration (routes, the Telegram receiver, token and chat ID) is the encrypted Secret
        # alertmanager-config (alertmanager-config.sops.yaml). Not useExistingSecret: the chart's own default
        # Secret keeps existing, unused, so nothing fights over it.
        configSecret: alertmanager-config
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

    grafana:
      defaultDashboardsTimezone: Asia/Bangkok
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      # Stateless: dashboards and data sources come from Git; only the admin login comes from a SOPS secret.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      grafana.ini:
        server:
          # The tailnet address of the sidecar below. After login Grafana redirects here, so a port-forward to
          # localhost still needs the tailnet to be reachable from that machine.
          root_url: https://grafana-ubuntu-extreme.dove-komodo.ts.net
      # The pod runs as the ServiceAccount that the Tailscale sidecar needs (grafana-tailscale.yaml); the chart's own
      # RBAC for the dashboard sidecars binds to this name too.
      serviceAccount:
        create: false
        name: grafana-tailscale
      extraContainerVolumes:
        - name: tailscale-config
          configMap:
            name: tailscale-serve-config
      # Tailscale sidecar, same pattern as Immich and Actual: tailnet-only access, name <app>-<machine>.
      # Deliberate exception to "pin image versions": a backward-compatible networking client that should pick up
      # security fixes (docs/services/immich.md). The key is only used on first join; the identity then lives in
      # the Secret grafana-tailscale-state.
      extraContainers: |
        - name: tailscale
          image: tailscale/tailscale:latest
          imagePullPolicy: Always
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: TS_AUTHKEY
            - name: TS_HOSTNAME
              value: grafana-ubuntu-extreme
            - name: TS_KUBE_SECRET
              value: grafana-tailscale-state
            - name: TS_USERSPACE
              value: "true"
            - name: TS_SERVE_CONFIG
              value: /config/serve.json
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tailscale-config
              mountPath: /config

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
