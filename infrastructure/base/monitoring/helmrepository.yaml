# infrastructure/base/monitoring/helmrepository.yaml
# Where Flux fetches the kube-prometheus-stack chart from. The chart version is pinned in each cluster's HelmRelease.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus-community
    app.kubernetes.io/instance: prometheus-community
    app.kubernetes.io/part-of: zion-lab
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
