# clusters/mini/apps.yaml
# Applies everything under apps/mini/ and decrypts *.sops.yaml with the sops-age key (ADR 0007).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
  labels:
    app.kubernetes.io/name: apps
    app.kubernetes.io/instance: mini-apps
    app.kubernetes.io/part-of: zion-lab
spec:
  interval: 10m
  retryInterval: 2m
  path: ./apps/mini
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
