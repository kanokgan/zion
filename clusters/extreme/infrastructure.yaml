# clusters/extreme/infrastructure.yaml
# Applies cluster-wide components (the GPU device plugin) before the apps. The `apps` and `monitoring`
# Kustomizations (apps.yaml, monitoring.yaml beside this file) depend on this one.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
  labels:
    app.kubernetes.io/name: infrastructure
    app.kubernetes.io/instance: extreme-infrastructure
    app.kubernetes.io/part-of: zion-lab
spec:
  interval: 10m
  retryInterval: 2m
  path: ./infrastructure/extreme
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
