# clusters/extreme/apps.yaml
# Applies everything under apps/extreme/ and decrypts *.sops.yaml with the sops-age key (ADR 0007).
# Waits for `infrastructure` first: the GPU device plugin must be running before pods ask for nvidia.com/gpu.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
  labels:
    app.kubernetes.io/name: apps
    app.kubernetes.io/instance: extreme-apps
    app.kubernetes.io/part-of: zion-lab
spec:
  interval: 10m
  retryInterval: 2m
  dependsOn:
    - name: infrastructure
  path: ./apps/extreme
  prune: true
  # Not `wait: true`: until the Actual cutover that Deployment is held at 0 replicas, and its local-path volume
  # stays Pending without a pod, so waiting on everything would never report Ready. Health is checked on the
  # Immich Deployments instead. At the cutover (replicas back to 1) switch back to `wait: true` and drop healthChecks.
  wait: false
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: immich-postgres
      namespace: immich
    - apiVersion: apps/v1
      kind: Deployment
      name: immich-redis
      namespace: immich
    - apiVersion: apps/v1
      kind: Deployment
      name: immich-machine-learning
      namespace: immich
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
