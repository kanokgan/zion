# apps/base/actual/actual.yaml
# Same version as the Lenovo (26.10.0, verified by image digest 2026-10-12). Data is a local volume; each
# cluster has its own separate Actual server (no shared storage).
# The Service name (actual) and namespace (actual) match the Lenovo so a Cloudflare tunnel backend URL
# like http://actual.actual.svc.cluster.local:5006 would resolve on either cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actual-data
  namespace: actual
  labels:
    app.kubernetes.io/name: actual
    app.kubernetes.io/instance: actual-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual
  namespace: actual
  labels:
    app.kubernetes.io/name: actual
    app.kubernetes.io/instance: actual
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: actual
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actual
        app.kubernetes.io/instance: actual
        app.kubernetes.io/part-of: zion-lab
    spec:
      containers:
        - name: actual
          image: actualbudget/actual-server:26.10.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ACTUAL_SERVER_FILES
              value: /data
            - name: ACTUAL_PORT
              value: "5006"
          ports:
            - name: http
              containerPort: 5006
          readinessProbe:
            tcpSocket:
              port: 5006
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5006
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual-data
---
apiVersion: v1
kind: Service
metadata:
  name: actual
  namespace: actual
  labels:
    app.kubernetes.io/name: actual
    app.kubernetes.io/instance: actual
spec:
  selector:
    app.kubernetes.io/name: actual
  ports:
    - name: http
      port: 5006
      targetPort: 5006
