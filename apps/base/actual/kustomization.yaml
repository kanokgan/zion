# apps/base/actual/kustomization.yaml
# Cluster-neutral Actual Budget definition. Tailscale access and secrets live in apps/<cluster>/actual/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: actual
resources:
  - namespace.yaml
  - actual.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: zion-lab
    includeSelectors: false
