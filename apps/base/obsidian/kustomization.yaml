# apps/base/obsidian/kustomization.yaml
# Cluster-neutral definition of Obsidian in the browser (Ignis behind a basic-auth Caddy sidecar). The data volume,
# Tailscale access, allowed origins and secrets live in apps/<cluster>/obsidian/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: obsidian
resources:
  - namespace.yaml
  - obsidian.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: zion-lab
    includeSelectors: false
