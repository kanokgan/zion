# apps/base/immich/server.yaml
# The Service name (immich-server) and namespace (immich) match the Lenovo so the Cloudflare tunnel backend
# URL http://immich-server.immich.svc.cluster.local:80 resolves on either cluster (ADR 0004).
# The library PVC (immich-library-pvc) is defined per cluster in apps/<cluster>/immich/.
# The image tag is deliberately absent: each cluster overlay pins it in its `images:` block (server and machine
# learning together). To upgrade Immich, see docs/services/immich.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-server
    app.kubernetes.io/instance: immich-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-server
        app.kubernetes.io/instance: immich-server
        app.kubernetes.io/part-of: zion-lab
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server
          imagePullPolicy: IfNotPresent
          env:
            - name: IMMICH_PORT
              value: "2283"
            - name: IMMICH_MACHINE_LEARNING_ENABLED
              value: "true"
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning:3003
          envFrom:
            - configMapRef:
                name: immich-config
            - secretRef:
                name: immich-secrets
          ports:
            - containerPort: 2283
          readinessProbe:
            httpGet:
              path: /server-info/ping
              port: 2283
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /server-info/ping
              port: 2283
            initialDelaySeconds: 600
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: library
              mountPath: /usr/src/app/upload
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-server
    app.kubernetes.io/instance: immich-server
spec:
  selector:
    app.kubernetes.io/name: immich-server
  ports:
    - port: 80
      targetPort: 2283
