# apps/base/silverbullet/kustomization.yaml
# Cluster-neutral SilverBullet definition. The data volume, Tailscale access and secrets live in apps/<cluster>/silverbullet/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: silverbullet
resources:
  - namespace.yaml
  - silverbullet.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: zion-lab
    includeSelectors: false
