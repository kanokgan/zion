# apps/base/silverbullet/silverbullet.yaml
# SilverBullet: markdown notes in a folder, served as a web app. Each cluster has its own separate instance and
# its own data volume (the claim `silverbullet-data` is defined in the overlay, because the Lenovo uses a host
# directory and the mini a local-path volume). Never two writers on the same data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silverbullet
  namespace: silverbullet
  labels:
    app.kubernetes.io/name: silverbullet
    app.kubernetes.io/instance: silverbullet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: silverbullet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: silverbullet
        app.kubernetes.io/instance: silverbullet
        app.kubernetes.io/part-of: zion-lab
    spec:
      containers:
        - name: silverbullet
          # Tag pinned per cluster in the overlay's `images:` block (upgrade runbook: docs/services/silverbullet.md).
          # The -slim variant leaves out Chromium and the Runtime API, which we do not use.
          image: ghcr.io/silverbulletmd/silverbullet
          imagePullPolicy: IfNotPresent
          env:
            # The space (the notes) is this folder. SB_USER is "username:password", from the encrypted Secret.
            - name: SB_FOLDER
              value: /data
            - name: SB_USER
              valueFrom:
                secretKeyRef:
                  name: silverbullet-auth
                  key: SB_USER
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: silverbullet-data
---
apiVersion: v1
kind: Service
metadata:
  name: silverbullet
  namespace: silverbullet
  labels:
    app.kubernetes.io/name: silverbullet
    app.kubernetes.io/instance: silverbullet
spec:
  selector:
    app.kubernetes.io/name: silverbullet
  ports:
    - name: http
      port: 3000
      targetPort: 3000
