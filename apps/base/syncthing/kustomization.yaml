# apps/base/syncthing/kustomization.yaml
# Cluster-neutral Syncthing definition. The volumes, Tailscale access and secrets live in apps/<cluster>/syncthing/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: syncthing
resources:
  - namespace.yaml
  - syncthing.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: zion-lab
    includeSelectors: false
