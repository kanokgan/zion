# apps/zion/immich/nodeport.yaml
# Public path for immich.kanokgan.com on the mini: the host's cloudflared (tunnel macos-mini) cannot resolve
# cluster DNS, so the server is also reachable on a fixed NodePort. Lima forwards guest 30283 to the Mac's
# 127.0.0.1:30283 (hosts/macos-mini/lima/zion.yaml); the tunnel route points at http://localhost:30283.
apiVersion: v1
kind: Service
metadata:
  name: immich-server-nodeport
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-server
    app.kubernetes.io/instance: immich-server-nodeport
    app.kubernetes.io/part-of: zion-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: immich-server
  ports:
    - name: http
      port: 80
      targetPort: 2283
      nodePort: 30283
