# apps/zion/actual/nodeport.yaml
# Public path for actual.kanokgan.com on the mini: the host's cloudflared (tunnel macos-mini) cannot resolve
# cluster DNS, so Actual is also reachable on a fixed NodePort. Lima forwards guest 30506 to the Mac's
# 127.0.0.1:30506 (hosts/macos-mini/lima/zion.yaml); the tunnel route points at http://localhost:30506.
apiVersion: v1
kind: Service
metadata:
  name: actual-nodeport
  namespace: actual
  labels:
    app.kubernetes.io/name: actual
    app.kubernetes.io/instance: actual-nodeport
    app.kubernetes.io/part-of: zion-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: actual
  ports:
    - name: http
      port: 5006
      targetPort: 5006
      nodePort: 30506
