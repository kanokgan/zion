# apps/extreme/obsidian/tailscale.yaml
# Tailscale sidecar support for Obsidian on the Lenovo: serve config (HTTPS on the tailnet name, proxied to
# Obsidian on 127.0.0.1:3000) and a ServiceAccount that lets the sidecar keep its node identity in the Secret
# obsidian-tailscale-state. The auth key is in tailscale-auth.sops.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-config
  namespace: obsidian
  labels:
    app.kubernetes.io/name: obsidian-tailscale
    app.kubernetes.io/instance: tailscale-config
    app.kubernetes.io/part-of: zion-lab
data:
  serve.json: |
    {
      "TCP": { "443": { "HTTPS": true } },
      "Web": {
        "${TS_CERT_DOMAIN}:443": {
          "Handlers": { "/": { "Proxy": "http://127.0.0.1:3000" } }
        }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: obsidian-tailscale
  namespace: obsidian
  labels:
    app.kubernetes.io/name: obsidian-tailscale
    app.kubernetes.io/instance: obsidian-tailscale
    app.kubernetes.io/part-of: zion-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: obsidian-tailscale
  namespace: obsidian
  labels:
    app.kubernetes.io/name: obsidian-tailscale
    app.kubernetes.io/instance: obsidian-tailscale
    app.kubernetes.io/part-of: zion-lab
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["obsidian-tailscale-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: obsidian-tailscale
  namespace: obsidian
  labels:
    app.kubernetes.io/name: obsidian-tailscale
    app.kubernetes.io/instance: obsidian-tailscale
    app.kubernetes.io/part-of: zion-lab
subjects:
  - kind: ServiceAccount
    name: obsidian-tailscale
    namespace: obsidian
roleRef:
  kind: Role
  name: obsidian-tailscale
  apiGroup: rbac.authorization.k8s.io
