# apps/extreme/obsidian/data.yaml
# The host directory /srv/obsidian on the Lenovo's NVMe, outside /var/lib/rancher so that removing k3s never touches
# it. Subfolders: vault/ (the live vault, also mounted by Syncthing and SilverBullet), ignis/data (Ignis settings),
# ignis/app (the downloaded Obsidian), and config/ (left over from the linuxserver image, unused since 2026-11-13).
# Bound statically to obsidian-data; Retain so deleting the claim never touches the files. Create the directories
# first (docs/services/obsidian.md). The capacity is a label, not a quota.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: obsidian-data-pv
  labels:
    app.kubernetes.io/name: obsidian
    app.kubernetes.io/instance: obsidian-data-pv
    app.kubernetes.io/part-of: zion-lab
spec:
  capacity:
    storage: 30Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: obsidian
    name: obsidian-data
  hostPath:
    path: /srv/obsidian
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obsidian-data
  namespace: obsidian
  labels:
    app.kubernetes.io/name: obsidian
    app.kubernetes.io/instance: obsidian-data
    app.kubernetes.io/part-of: zion-lab
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: obsidian-data-pv
  resources:
    requests:
      storage: 30Gi
