# apps/extreme/immich/nodeport.yaml
# Public path for immich.kanokgan.com on the Lenovo: the host's cloudflared (tunnel ubuntu-extreme) cannot resolve
# cluster DNS, so the server is also reachable on a fixed NodePort, here on the host's localhost:30283. The tunnel
# route points at http://localhost:30283 (same port as on the mini, ADR 0009).
apiVersion: v1
kind: Service
metadata:
  name: immich-server-nodeport
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-server
    app.kubernetes.io/instance: immich-server-nodeport
    app.kubernetes.io/part-of: zion-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: immich-server
  ports:
    - name: http
      port: 80
      targetPort: 2283
      nodePort: 30283
