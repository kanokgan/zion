# apps/extreme/immich/kustomization.yaml
# Immich on the Lenovo (cluster `extreme`, ADR 0009): primary, served at https://immich.kanokgan.com (host cloudflared,
# tunnel ubuntu-extreme -> localhost:30283 -> nodeport.yaml) and, for debugging this one instance, at
# https://immich-ubuntu-extreme.dove-komodo.ts.net (Tailscale sidecar in the server pod, tailnet only). Machine learning runs on the GPU (CUDA image, time-sliced, see infrastructure/extreme).
# The library is the host directory /srv/immich (library.yaml), outside k3s's state.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/immich
  - library.yaml
  - nodeport.yaml
  - tailscale.yaml
  - secret.sops.yaml
  - tailscale-auth.sops.yaml
# Immich version: the ONE place to edit for an upgrade (runbook: docs/services/immich.md). Server and machine
# learning must always have the same version, so change both lines together. Pinned to v3.2.4, the version of the
# dump the cutover restores; upgrade afterwards, not during. The CUDA image is the same version with a -cuda suffix.
images:
  - name: ghcr.io/immich-app/immich-server
    newTag: v3.3.4
  - name: ghcr.io/immich-app/immich-machine-learning
    newTag: v3.3.4-cuda
patches:
  # Set to 1 in the cutover commit (ADR 0009). Before the library was copied and the database restored it was 0: an
  # empty Immich reachable on the tailnet offers first-run admin signup to anyone there, so restore right after start.
  - target:
      kind: Deployment
      name: immich-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # Server: asks for a GPU slice (transcoding) and runs with the NVIDIA runtime. Sizes as on the old Lenovo cluster.
  - target:
      kind: Deployment
      name: immich-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: immich-server
      spec:
        template:
          spec:
            runtimeClassName: nvidia
            containers:
              - name: immich-server
                resources:
                  requests:
                    cpu: 500m
                    memory: 4Gi
                    nvidia.com/gpu: "1"
                  limits:
                    cpu: "6"
                    memory: 24Gi
                    nvidia.com/gpu: "1"
  # Machine learning on the GPU. The CUDA image and its models need more memory than the CPU defaults.
  - target:
      kind: Deployment
      name: immich-machine-learning
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: immich-machine-learning
      spec:
        template:
          spec:
            runtimeClassName: nvidia
            containers:
              - name: immich-machine-learning
                resources:
                  requests:
                    cpu: 250m
                    memory: 1Gi
                    nvidia.com/gpu: "1"
                  limits:
                    cpu: "2"
                    memory: 6Gi
                    nvidia.com/gpu: "1"
  # Postgres: more headroom than the base (1 CPU, 1.5Gi). The cutover restore of the ~1 GB dump ran pinned at the 1 CPU
  # limit for many minutes, and GPU machine learning now writes embeddings and faces to the database continuously.
  # The requests stay at the base values, so the scheduler reserves no more than before. Rolling this restarts Postgres.
  - target:
      kind: Deployment
      name: immich-postgres
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: immich-postgres
      spec:
        template:
          spec:
            containers:
              - name: postgres
                resources:
                  limits:
                    cpu: "2"
                    memory: 3Gi
  # External libraries from the NAS, read-only: a NAS folder bind-mounted on the host at /srv/external/camera-uploads
  # (fstab pattern in hosts/ubuntu-extreme/fstab.example; the real share and folder names stay out of Git) and shown
  # to Immich at /CameraUpload. Libraries are created in the Immich UI, one import path per subfolder, for example
  # /CameraUpload/<SubFolder>; the import path is checked inside the container, so it must start with this mount path.
  # type: Directory, so a missing host path stops the pod loudly. HostToContainer, so a mount that comes up after
  # k3s still becomes visible. If the NAS is down, the folder is empty and a scan marks the assets offline until the
  # files are back.
  - target:
      kind: Deployment
      name: immich-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: immich-server
      spec:
        template:
          spec:
            containers:
              - name: immich-server
                volumeMounts:
                  - name: external-camera-uploads
                    mountPath: /CameraUpload
                    readOnly: true
                    mountPropagation: HostToContainer
            volumes:
              - name: external-camera-uploads
                hostPath:
                  path: /srv/external/camera-uploads
                  type: Directory
  - target:
      kind: Deployment
      name: immich-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: immich-server
      spec:
        template:
          spec:
            serviceAccountName: immich-tailscale
            containers:
              - name: tailscale
                # Deliberate exception to "pin image versions": a networking client that stays backward compatible
                # and should pick up security fixes. Always pulls on start, so this needs Docker Hub reachable.
                image: tailscale/tailscale:latest
                imagePullPolicy: Always
                env:
                  - name: TS_AUTHKEY
                    valueFrom:
                      secretKeyRef:
                        name: tailscale-auth
                        key: TS_AUTHKEY
                  - name: TS_HOSTNAME
                    value: immich-ubuntu-extreme
                  - name: TS_KUBE_SECRET
                    value: immich-tailscale-state
                  - name: TS_USERSPACE
                    value: "true"
                  - name: TS_SERVE_CONFIG
                    value: /config/serve.json
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
                volumeMounts:
                  - name: tailscale-config
                    mountPath: /config
            volumes:
              - name: tailscale-config
                configMap:
                  name: tailscale-serve-config
