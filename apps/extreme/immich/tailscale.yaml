# apps/extreme/immich/tailscale.yaml
# Tailscale sidecar support for Immich on the Lenovo: serve config, and a ServiceAccount that lets the sidecar
# keep its node identity in a Secret (immich-tailscale-state) so restarts do not create new devices.
# The auth key is in tailscale-auth.sops.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-serve-config
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-tailscale
    app.kubernetes.io/instance: tailscale-serve-config
    app.kubernetes.io/part-of: zion-lab
data:
  serve.json: |
    {
      "TCP": { "443": { "HTTPS": true } },
      "Web": {
        "${TS_CERT_DOMAIN}:443": {
          "Handlers": { "/": { "Proxy": "http://127.0.0.1:2283" } }
        }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich-tailscale
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-tailscale
    app.kubernetes.io/instance: immich-tailscale
    app.kubernetes.io/part-of: zion-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: immich-tailscale
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-tailscale
    app.kubernetes.io/instance: immich-tailscale
    app.kubernetes.io/part-of: zion-lab
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["immich-tailscale-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: immich-tailscale
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-tailscale
    app.kubernetes.io/instance: immich-tailscale
    app.kubernetes.io/part-of: zion-lab
subjects:
  - kind: ServiceAccount
    name: immich-tailscale
    namespace: immich
roleRef:
  kind: Role
  name: immich-tailscale
  apiGroup: rbac.authorization.k8s.io
