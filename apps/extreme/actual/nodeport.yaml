# apps/extreme/actual/nodeport.yaml
# Public path for actual.kanokgan.com on the Lenovo: the host's cloudflared (tunnel ubuntu-extreme) cannot resolve
# cluster DNS, so Actual is also reachable on a fixed NodePort, here on the host's localhost:30506. The tunnel
# route points at http://localhost:30506 (same port as on the mini, ADR 0009).
apiVersion: v1
kind: Service
metadata:
  name: actual-nodeport
  namespace: actual
  labels:
    app.kubernetes.io/name: actual
    app.kubernetes.io/instance: actual-nodeport
    app.kubernetes.io/part-of: zion-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: actual
  ports:
    - name: http
      port: 5006
      targetPort: 5006
      nodePort: 30506
