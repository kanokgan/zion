# apps/mini/silverbullet/kustomization.yaml
# SilverBullet on the mini: a warm standby of the Lenovo's instance (ADR 0004 pattern), NOT where notes are
# written. Tailnet only, at https://silverbullet-macos-mini.dove-komodo.ts.net (Tailscale sidecar). No NodePort and
# no tunnel route: silverbullet.kanokgan.com is served by the Lenovo (tunnel ubuntu-extreme). Its data is refreshed
# from the NAS backup by hand; anything written here is overwritten at the next refresh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/silverbullet
  - data.yaml
  - tailscale.yaml
  - tailscale-auth.sops.yaml
  - silverbullet-auth.sops.yaml
# SilverBullet version: keep the same as the Lenovo (runbook: docs/services/silverbullet.md).
images:
  - name: ghcr.io/silverbulletmd/silverbullet
    newTag: 2.12.1-slim
patches:
  - target:
      kind: Deployment
      name: silverbullet
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: silverbullet
      spec:
        template:
          spec:
            serviceAccountName: silverbullet-tailscale
            containers:
              - name: tailscale
                # Deliberate exception to "pin image versions" (same as Immich and Actual): a backward-compatible
                # networking client that should pick up security fixes. Needs Docker Hub reachable on start.
                image: tailscale/tailscale:latest
                imagePullPolicy: Always
                env:
                  - name: TS_AUTHKEY
                    valueFrom:
                      secretKeyRef:
                        name: tailscale-auth
                        key: TS_AUTHKEY
                  - name: TS_HOSTNAME
                    value: silverbullet-macos-mini
                  - name: TS_KUBE_SECRET
                    value: silverbullet-tailscale-state
                  - name: TS_USERSPACE
                    value: "true"
                  - name: TS_SERVE_CONFIG
                    value: /config/serve.json
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
                volumeMounts:
                  - name: tailscale-config
                    mountPath: /config
            volumes:
              - name: tailscale-config
                configMap:
                  name: tailscale-config
