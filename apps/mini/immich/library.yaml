# apps/mini/immich/library.yaml
# The standby library: the external NVMe's Immich folder, shared into the Lima VM at /mnt/immich-library
# (hosts/macos-mini/lima/zion.yaml). Bound statically to immich-library-pvc; Retain so deleting the claim never touches the files.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library-pv
  labels:
    app.kubernetes.io/name: immich-library
    app.kubernetes.io/instance: immich-library-pv
    app.kubernetes.io/part-of: zion-lab
spec:
  capacity:
    storage: 1Ti
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: immich
    name: immich-library-pvc
  hostPath:
    path: /mnt/immich-library
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-pvc
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-library
    app.kubernetes.io/instance: immich-library-pvc
    app.kubernetes.io/part-of: zion-lab
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: immich-library-pv
  resources:
    requests:
      storage: 1Ti
