# apps/mini/immich/kustomization.yaml
# Mini overlay (ADR 0004): was production 2026-10-17 to 2026-10-20. Since the cutover to the Lenovo it is an old, frozen
# copy; immich.kanokgan.com points at the Lenovo. Do not upload here. Never refresh the NVMe from the NAS by accident,
# and keep the mini to NAS job off while the Lenovo's job writes that path.
# PARKED since 2026-11-21: every Deployment at 0 (the server was stuck in ContainerCreating). Volumes, Secrets and the
# Tailscale identity are kept. To bring it back: fix the cause, then set server, postgres and redis to 1 (ML stays 0);
# it is reachable only at https://macos-mini-immich.dove-komodo.ts.net (Tailscale sidecar in the server pod).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/immich
  - library.yaml
  - nodeport.yaml
  - tailscale.yaml
  - secret.sops.yaml
  - tailscale-auth.sops.yaml
# Immich version: the ONE place to edit for an upgrade (runbook: docs/services/immich.md). Server and machine
# learning must always have the same tag, so change both lines together.
images:
  - name: ghcr.io/immich-app/immich-server
    newTag: v3.2.4
  - name: ghcr.io/immich-app/immich-machine-learning
    newTag: v3.2.4
# Parked (see header). Machine learning stays at 0 even when the rest comes back (no GPU on the mini).
replicas:
  - name: immich-server
    count: 0
  - name: immich-postgres
    count: 0
  - name: immich-redis
    count: 0
  - name: immich-machine-learning
    count: 0
patches:
  - target:
      kind: Deployment
      name: immich-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "false"
  - target:
      kind: Deployment
      name: immich-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: immich-server
      spec:
        template:
          spec:
            serviceAccountName: immich-tailscale
            containers:
              - name: tailscale
                # Deliberate exception to "pin image versions": a networking client that stays backward compatible
                # and should pick up security fixes. Always pulls on start, so this needs Docker Hub reachable.
                image: tailscale/tailscale:latest
                imagePullPolicy: Always
                env:
                  - name: TS_AUTHKEY
                    valueFrom:
                      secretKeyRef:
                        name: tailscale-auth
                        key: TS_AUTHKEY
                  - name: TS_HOSTNAME
                    value: macos-mini-immich
                  - name: TS_KUBE_SECRET
                    value: immich-tailscale-state
                  - name: TS_USERSPACE
                    value: "true"
                  - name: TS_SERVE_CONFIG
                    value: /config/serve.json
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
                volumeMounts:
                  - name: tailscale-config
                    mountPath: /config
            volumes:
              - name: tailscale-config
                configMap:
                  name: tailscale-serve-config
