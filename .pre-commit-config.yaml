# .pre-commit-config.yaml
# Checks that run before every commit. This repo is public, so anything committed is published.
# One-time setup: pip install pre-commit && pre-commit install
# Run on everything: pre-commit run --all-files
repos:
  # Secrets: API keys, tokens, private keys (including age secret keys).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Private terms that are not secrets (family names and similar), listed in the gitignored .denylist.
  - repo: local
    hooks:
      - id: denylist
        name: private terms (.denylist)
        entry: script/check-denylist.sh
        language: script
        pass_filenames: false
        always_run: true
