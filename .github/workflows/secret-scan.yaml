# .github/workflows/secret-scan.yaml
# Backstop for the pre-commit hooks: scans the full Git history for secrets on every push to main and every PR.
# A finding here means it is already public: rotate the secret first, then clean up.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact --verbose
